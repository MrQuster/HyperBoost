name: Release Signed APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret KEYSTORE_BASE64 is not set in repository settings!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-signing.jks"

      - name: Determine Version Name
        id: vars
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VER="${RAW_TAG#v}"
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean test assembleRelease -PversionName="${{ steps.vars.outputs.version }}"

      - name: Verify APK Signature and Generate SHA-256
        run: |
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*-release.apk" | head -n 1)
          APK_FINAL="HyperBoost-${{ steps.vars.outputs.tag }}.apk"
          cp "$APK_SOURCE" "$APK_FINAL"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK_FINAL"

          sha256sum "$APK_FINAL" > "${APK_FINAL}.sha256"
          cat "${APK_FINAL}.sha256"

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-signing.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "HyperBoost ${{ steps.vars.outputs.tag }}"
          generate_release_notes: true
          files: |
            HyperBoost-${{ steps.vars.outputs.tag }}.apk
            HyperBoost-${{ steps.vars.outputs.tag }}.apk.sha256
