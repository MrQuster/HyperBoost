<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Глубокий космический фон -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#1A103C" />
      <stop offset="100%" stop-color="#06283D" />
    </linearGradient>

    <!-- Размытые цветные blob-пятна под стеклом -->
    <radialGradient id="blobCyan" cx="30%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#00B4D8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.0" />
    </radialGradient>

    <radialGradient id="blobMagenta" cx="72%" cy="74%" r="50%">
      <stop offset="0%" stop-color="#F72585" stop-opacity="0.60" />
      <stop offset="55%" stop-color="#7209B7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0.0" />
    </radialGradient>

    <!-- Заливка жидкого стекла -->
    <linearGradient id="glassFill" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52" />
      <stop offset="45%" stop-color="#A8E6FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10" />
    </linearGradient>

    <!-- Стеклянная обводка (ярче сверху-слева, слабее снизу-справа) -->
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#00F5D4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12" />
    </linearGradient>

    <!-- Градиент звуковых волн -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="55%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#F72585" />
    </linearGradient>
  </defs>

  <!-- Базовый слой со скруглением squircle -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGrad)" />
  <circle cx="310" cy="290" r="460" fill="url(#blobCyan)" />
  <circle cx="740" cy="750" r="480" fill="url(#blobMagenta)" />

  <!-- Внешняя стеклянная капсула-линза -->
  <circle cx="512" cy="512" r="310" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="10" />

  <!-- Верхний блик линзы -->
  <path d="M 275 380 A 285 285 0 0 1 749 380 A 295 265 0 0 0 275 380 Z" fill="#FFFFFF" fill-opacity="0.28" />

  <!-- Мягкая тень под динамиком -->
  <path d="M 290 452 L 372 452 L 488 346 C 506 330 532 342 532 366 L 532 698 C 532 722 506 734 488 718 L 372 612 L 290 612 C 266 612 248 594 248 570 L 248 494 C 248 470 266 452 290 452 Z" fill="#050814" fill-opacity="0.38" transform="translate(0, 18)" />

  <!-- Стеклянный корпус динамика -->
  <path d="M 290 452 L 372 452 L 488 346 C 506 330 532 342 532 366 L 532 698 C 532 722 506 734 488 718 L 372 612 L 290 612 C 266 612 248 594 248 570 L 248 494 C 248 470 266 452 290 452 Z" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="14" stroke-linejoin="round" />

  <!-- Внутренний блик на грани динамика -->
  <path d="M 286 472 L 374 472 L 485 372" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="10" stroke-linecap="round" />

  <!-- 3 дуги звуковых волн -->
  <path d="M 596 432 A 115 115 0 0 1 596 592" fill="none" stroke="url(#waveGrad)" stroke-width="32" stroke-linecap="round" />
  <path d="M 656 372 A 198 198 0 0 1 656 652" fill="none" stroke="url(#waveGrad)" stroke-width="32" stroke-linecap="round" stroke-opacity="0.88" />
  <path d="M 718 312 A 285 285 0 0 1 718 712" fill="none" stroke="url(#waveGrad)" stroke-width="32" stroke-linecap="round" stroke-opacity="0.65" />
</svg>